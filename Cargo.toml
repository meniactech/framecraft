[workspace]
resolver = "3"
members = ["crates/framecraft-core", "crates/framecraft-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/meniactech/FrameCraft"
authors = ["MENiAC"]
rust-version = "1.88"

[workspace.dependencies]
framecraft-core = { path = "crates/framecraft-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
lto = "thin"
