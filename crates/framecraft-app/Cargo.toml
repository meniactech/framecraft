[package]
name = "framecraft-app"
description = "FrameCraft desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "framecraft"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
framecraft-core.workspace = true
# Same backend as dioxus-desktop (XDG portal).
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

# Linux: native frame capture (hidden WebKit view + WebKit's own snapshot),
# the same versions wry already uses; cairo's PNG writer is a feature switch.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.1"
gtk = "0.18.2"
cairo-rs = { version = "0.18.5", features = ["png"] }
javascriptcore-rs = "1.1.2"

# PNG decode/encode for scaling captures to the scene size (in the tree).
[dependencies.png]
version = "0.18.1"

# macOS: native frame capture (hidden WKWebView + takeSnapshot), the same
# versions wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSURLRequest", "NSData", "NSValue", "NSDictionary", "NSGeometry", "NSError"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSView", "NSResponder", "NSGraphics"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKNavigation", "block2", "objc2-app-kit"] }

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.12"
