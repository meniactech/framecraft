[package]
name = "framecraft-app"
description = "FrameCraft desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "framecraft"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
framecraft-core.workspace = true
# Same backend as dioxus-desktop (XDG portal).
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

# Linux: the webview's WebKitGTK API (same version as wry's), to let the
# preview's own scheme make CORS requests (particle sprites stay readable).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.1"
